# Alacritty Modern TOML Configuration (Alacritty >= 0.13)
# Fully compatible with Kali Linux and Debian 12 (Bookworm)

[window]
padding = { x = 6, y = 6 }
dynamic_padding = true
decorations = "full"
opacity = 0.85

[font]
size = 11.5

[font.normal]
family = "Iosevka Nerd Font"
style = "Regular"

[font.bold]
family = "Iosevka Nerd Font"
style = "Bold"

[font.italic]
family = "Iosevka Nerd Font"
style = "Italic"

[scrolling]
history = 10000
multiplier = 3

[colors.primary]
background = "0x000000"
foreground = "0xeaeaea"

[colors.normal]
black = "0x000000"
red = "0xd54e53"
green = "0xb9ca4a"
yellow = "0xe6c547"
blue = "0x7aa6da"
magenta = "0xc397d8"
cyan = "0x70c0ba"
white = "0xeaeaea"

[colors.bright]
black = "0x666666"
red = "0xff3334"
green = "0x9ec400"
yellow = "0xe7c547"
blue = "0x7aa6da"
magenta = "0xb77ee0"
cyan = "0x54ced6"
white = "0xffffff"

[bell]
duration = 0
