# Compton Compositor Configuration (Legacy fallback)
backend = "xrender";

# Fix inactive window blanking
use-damage = false;
xrender-sync-fence = true;

shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.5;

fading = true;
fade-delta = 5;
fade-in-step = 0.04;
fade-out-step = 0.04;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = false;
vsync = "none";

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Native opacity for terminals
opacity-rule = [
	"95:class_g = 'Code'",
	"95:class_g = 'Sublime_text'",
	"95:class_g = 'Rofi'"
];

focus-exclude = [
  "class_g = 'Alacritty'",
  "class_g = 'Rofi'"
];

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.90; focus = true; };
};
