# i3blocks config file
#
# Global properties
separator_block_width=24
separator=true
markup=none

# CPU usage
[cpu]
command=~/.config/i3/scripts/cpu.sh
interval=2
color=#50FA7B

# Memory usage
[memory]
command=~/.config/i3/scripts/memory.sh
interval=5
color=#BD93F9

# Disk usage
[disk]
command=~/.config/i3/scripts/disk.sh
interval=60
color=#F1FA8C

# Network Bandwidth (Auto-detects interface & calculates real-time speed)
[bandwidth]
command=~/.config/i3/scripts/bandwidth.sh
interval=2
color=#8BE9FD

# Network IP (Shows VPN in green or LAN IP in blue)
[network]
command=~/.config/i3/scripts/network.sh
interval=5

# Date and Time
[time]
label=  
command=date '+%a, %d %b %Y  %I:%M:%S %p'
interval=1
color=#F8F8F2
