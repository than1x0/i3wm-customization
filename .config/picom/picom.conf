# Picom Modern Compositor Configuration
# Optimized for VMware, VirtualBox & Bare-Metal Kali Linux / Debian

# Backend
backend = "xrender";

# Fix for Alacritty / X11 / VMware ghosting & disappearing inactive windows
use-damage = false;
xrender-sync-fence = true;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.5;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

# Opacity Rules
# Note: Alacritty handles its own background opacity natively to prevent inactive window redraw bugs.
opacity-rule = [
  "95:class_g = 'Code'",
  "95:class_g = 'Sublime_text'",
  "95:class_g = 'Rofi'"
];

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
detect-client-opacity = false;

# Ensure terminal windows are never blanked out or corrupted when unfocused
focus-exclude = [
  "class_g = 'Alacritty'",
  "class_g = 'Rofi'"
];

# Window behavior
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-transient = true;
vsync = false;

# Window Types
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.90; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
